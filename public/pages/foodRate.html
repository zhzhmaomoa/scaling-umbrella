<!DOCTYPE html>
<html>

<head>
	<title>后台-foodRate</title>
	<link rel="stylesheet" href="../public.css" />

	<head>

	<body>
		<com-layout>
			<com-table id="table"></com-table>
		</com-layout>
		<script type="module" src="../components/comTable.js"></script>
		<script type="module" src="../components/comLayout.js"></script>
		<script type="module">
			import { asyncQuery, asyncAdd, asyncEdit, asyncDeleteOne } from "../api/foodRate.js"
			const table = document.querySelector("#table");
			table.setAttribute("caption", "FoodRate")
			table.setAttribute("content", JSON.stringify({
				"fields": {
					'id': {
						type: "hidden"
					},
					'date':{
						type:"date",
						required: 'true'
					},
					'title': {
						required: 'true'
					},
					'desc':{

					},
					'rate':{
						type:"number",
						value:"0",
						min:"0",
						step:"0.1"
					},
					'imageSrc': {
						type: 'file',
						accept: "image/*",
					},
					'lat':{
						type:"number",
						value:"0",
						min:"0",
						step:"0.0000001"
					},
					'lng':{
						type:"number",
						value:"0",
						min:"0",
						step:"0.0000001"
					},					
				},
				'events': {
					asyncQuery: asyncQuery.toString(),
					asyncAdd: asyncAdd.toString(),
					asyncEdit: asyncEdit.toString(),
					asyncDeleteOne: asyncDeleteOne.toString()
				}
			}))
		</script>
	</body>

</html>
